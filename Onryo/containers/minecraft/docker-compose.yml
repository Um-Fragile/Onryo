version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: onryo-minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "2G"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      MOTD: "Onryo Minecraft Server"
      SEED: ""
      # Adjust MEMORY based on available RAM. Keep below 50% of total RAM
      # to avoid starving the Onryo framework itself.
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: "1.5"

# NOTE: This container is DISABLED by default via info.json (enabled_by_default: false).
# Enable it from the Onryo Services page or set enabled_by_default to true in info.json.
